<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <radialGradient id="flashlight" cx="45%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.95"/>
    </radialGradient>
    <pattern id="campusGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#0f0f13"/>
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#22222a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="360" rx="16" fill="#09090b"/>
  <rect width="600" height="360" rx="16" fill="url(#campusGrid)"/>
  
  <!-- Choke point walls & layout -->
  <rect x="80" y="60" width="180" height="40" rx="4" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <rect x="340" y="60" width="180" height="40" rx="4" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <rect x="80" y="240" width="180" height="40" rx="4" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <rect x="340" y="240" width="180" height="40" rx="4" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>

  <!-- Flashlight beam effect -->
  <circle cx="270" cy="170" r="160" fill="url(#flashlight)"/>

  <!-- Player sprite & navigation radar -->
  <circle cx="270" cy="170" r="14" fill="#f4f4f5"/>
  <circle cx="270" cy="170" r="28" fill="none" stroke="#f4f4f5" stroke-dasharray="3 3" opacity="0.5"/>

  <!-- Zombie dots in distance -->
  <circle cx="420" cy="160" r="10" fill="#e0584f" opacity="0.8"/>
  <circle cx="450" cy="190" r="10" fill="#e0584f" opacity="0.8"/>

  <!-- HUD overlay -->
  <rect x="30" y="30" width="180" height="30" rx="6" fill="#121215" stroke="#2a2a30" opacity="0.9"/>
  <text x="45" y="50" fill="#f4f4f5" font-family="'Courier New', monospace" font-size="11" font-weight="700">CAMPUS BREAKOUT</text>

  <rect x="420" y="300" width="150" height="30" rx="6" fill="#121215" stroke="#2a2a30" opacity="0.9"/>
  <text x="495" y="320" fill="#a0a0a8" font-family="'Courier New', monospace" font-size="10" text-anchor="middle">UNITY · C# · 2D</text>
</svg>
